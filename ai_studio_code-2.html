<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서남권 교육 인프라 데이터 시각화</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FCF9F2; /* 아이보리 배경 */
            --card-bg: #ffffff;
            --primary-pink: #F4C2C2; /* 파스텔 핑크 */
            --accent-pink: #E5A9A9;
            --text-main: #4A4A4A;
            --text-muted: #7A7A7A;
            --warning-red: #FFB3B3;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        header .divider {
            width: 60px;
            height: 4px;
            background-color: var(--primary-pink);
            margin: 0 auto;
            border-radius: 2px;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-full {
            grid-column: span 2;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
        }

        /* Status Cards Style */
        .museum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .status-pill {
            padding: 20px 15px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .status-pill.warning {
            background-color: var(--warning-red);
            color: #8B0000;
        }

        .status-pill.normal {
            background-color: var(--bg-color);
            border: 1px solid var(--primary-pink);
        }

        .status-pill h4 { margin: 8px 0; font-size: 1.2rem; font-weight: 700; }
        .status-pill span { font-size: 0.85rem; font-weight: 500; opacity: 0.8; }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .card-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>서남권 교육 인프라 분석현황</h1>
        <div class="divider"></div>
    </header>

    <div class="dashboard-grid">
        <!-- Chart 1: Academy Count -->
        <div class="card">
            <div class="card-title">
                <i data-lucide="graduation-cap"></i> 자치구별 학원 수 밀집도
            </div>
            <canvas id="academyChart"></canvas>
        </div>

        <!-- Chart 2: Scatter Plot -->
        <div class="card">
            <div class="card-title">
                <i data-lucide="line-chart"></i> 학원 수 vs 도서관 이용객 상관관계
            </div>
            <canvas id="scatterChart"></canvas>
        </div>

        <!-- Section 3: Museum Status Cards -->
        <div class="card card-full">
            <div class="card-title">
                <i data-lucide="landmark"></i> 지역별 박물관/미술관 인프라 현황
            </div>
            <div class="museum-grid" id="museumGrid">
                <!-- JS dynamic render -->
            </div>
        </div>
    </div>
</div>

<script>
    // [Data Source] SQLite 분석 결과
    const eduData = [
        { name: "강서구", academies: 1381, libraryUsers: 234216, population: 563058, museums: 4, hasMuseum: "있음" },
        { name: "관악구", academies: 727, libraryUsers: 69033, population: 481956, museums: 3, hasMuseum: "있음" },
        { name: "구로구", academies: 789, libraryUsers: 116983, population: 392405, museums: 2, hasMuseum: "있음" },
        { name: "금천구", academies: 369, libraryUsers: 132065, population: 227481, museums: 0, hasMuseum: "없음" },
        { name: "동작구", academies: 924, libraryUsers: 149150, population: 378769, museums: 1, hasMuseum: "있음" },
        { name: "양천구", academies: 2103, libraryUsers: 99239, population: 436028, museums: 0, hasMuseum: "없음" },
        { name: "영등포구", academies: 868, libraryUsers: 63209, population: 374794, museums: 3, hasMuseum: "있음" }
    ];

    lucide.createIcons();

    // Chart 1: Bar Chart
    const ctx1 = document.getElementById('academyChart').getContext('2d');
    new Chart(ctx1, {
        type: 'bar',
        data: {
            labels: eduData.map(d => d.name),
            datasets: [{
                label: '학원 수',
                data: eduData.map(d => d.academies),
                backgroundColor: eduData.map(d => d.name === '양천구' ? '#E5A9A9' : '#F4C2C2'),
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });

    // Chart 2: Scatter Plot
    const ctx2 = document.getElementById('scatterChart').getContext('2d');
    new Chart(ctx2, {
        type: 'scatter',
        data: {
            datasets: [{
                label: '자치구별 데이터',
                data: eduData.map(d => ({ x: d.academies, y: d.libraryUsers, label: d.name })),
                backgroundColor: '#E5A9A9',
                pointRadius: 8,
                pointHoverRadius: 10
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: (context) => {
                            const point = context.raw;
                            return `${point.label}: 학원(${point.x}개), 도서관(${point.y.toLocaleString()}명)`;
                        }
                    }
                }
            },
            scales: {
                x: { title: { display: true, text: '학원 수' }, grid: { color: '#f0f0f0' } },
                y: { title: { display: true, text: '도서관 이용객' }, grid: { color: '#f0f0f0' } }
            }
        }
    });

    // Section 3: Status Cards
    const museumGrid = document.getElementById('museumGrid');
    eduData.forEach(d => {
        const div = document.createElement('div');
        div.className = `status-pill ${d.museums === 0 ? 'warning' : 'normal'}`;
        div.innerHTML = `
            <span>${d.name}</span>
            <h4>${d.museums}개</h4>
            <span>${d.museums === 0 ? '인프라 부족' : '시설 보유'}</span>
        `;
        museumGrid.appendChild(div);
    });
</script>

</body>
</html>
